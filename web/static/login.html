<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sign in · Pool</title>
<link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/app.css?v=__BUILD__">
<style>
  .auth-wrap { min-height: 100vh; display: grid; place-items: center; padding: 1.25rem; }
  .auth { width: min(430px, 100%); padding: 2rem; }
  .auth h1 { font-size: 1.6rem; margin-bottom: .4rem; }
  .divider { display: flex; align-items: center; gap: .75rem; margin: 1.25rem 0; color: var(--fg-dim); font-size: .76rem; }
  .divider::before, .divider::after { content: ""; flex: 1; height: 1px; background: var(--glass-border); }
  .switcher { text-align: center; margin-top: 1.25rem; font-size: .86rem; color: var(--fg-muted); }
</style>
</head>
<body>

<div class="auth-wrap">
  <div class="glass auth">
    <a href="/" class="brand" style="margin-bottom:1.5rem">
      <span class="brand-mark">
        <svg viewBox="0 0 24 24" fill="none" stroke="#04140f" stroke-width="2.4" stroke-linecap="round">
          <path d="M2 16c2.5 0 2.5-2 5-2s2.5 2 5 2 2.5-2 5-2 2.5 2 5 2"/>
          <path d="M2 21c2.5 0 2.5-2 5-2s2.5 2 5 2 2.5-2 5-2 2.5 2 5 2"/>
          <path d="M7 14V5a2 2 0 0 1 4 0M17 14V5a2 2 0 0 0-4 0"/>
        </svg>
      </span>
      <span>Pool</span>
    </a>

    <h1 id="title">Welcome back</h1>
    <p class="muted small" id="subtitle">Sign in to your pool dashboard.</p>

    <div id="error" class="hidden" style="margin:1rem 0;padding:.7rem .85rem;border-radius:var(--radius-sm);background:rgba(208,59,59,.12);border:1px solid rgba(208,59,59,.35);font-size:.85rem"></div>

    <div id="demo-box" class="hidden" style="margin-top:1.25rem">
      <button class="btn btn-block" id="demo-btn" style="border-color:rgba(42,212,196,.4);background:rgba(42,212,196,.1);color:var(--accent);font-weight:620">
        Explore the live demo
      </button>
      <p class="small dim center" style="margin:.5rem 0 0">
        A fully populated pool — two seasons of tests, costs and receipts.<br>
        <span class="mono" id="demo-creds"></span>
      </p>
    </div>

    <div id="oauth" class="stack" style="gap:.6rem;margin-top:1.25rem"></div>

    <div class="divider" id="divider">OR</div>

    <form id="form" class="stack" style="gap:.85rem">
      <div class="field" id="name-field" style="display:none">
        <label for="name">Name</label>
        <input id="name" autocomplete="name" placeholder="Your name">
      </div>
      <div class="field">
        <label for="email">Email</label>
        <input id="email" type="email" autocomplete="email" required placeholder="you@example.com">
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input id="password" type="password" autocomplete="current-password" required placeholder="••••••••">
        <span class="hint" id="pw-hint" style="display:none">At least 8 characters.</span>
      </div>
      <div class="field" id="invite-field" style="display:none">
        <label for="invite">Invite code</label>
        <input id="invite" placeholder="XXXXX-XXXXX">
      </div>
      <button class="btn btn-primary btn-block" type="submit" id="submit">Sign in</button>
    </form>

    <div class="switcher" id="switcher"></div>
  </div>
</div>

<script type="module">
import { api, toast } from '/js/api.js';

let mode = 'login';
let config = {};

const $ = s => document.querySelector(s);

function showError(msg) {
  const e = $('#error');
  e.textContent = msg;
  e.classList.remove('hidden');
}

const ICONS = {
  github: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 .3a12 12 0 0 0-3.8 23.4c.6.1.8-.3.8-.6v-2c-3.3.7-4-1.6-4-1.6-.6-1.4-1.4-1.8-1.4-1.8-1-.7.1-.7.1-.7 1.2.1 1.8 1.2 1.8 1.2 1 1.8 2.8 1.3 3.5 1 .1-.8.4-1.3.7-1.6-2.7-.3-5.5-1.3-5.5-5.9 0-1.3.5-2.4 1.2-3.2-.1-.3-.5-1.5.1-3.2 0 0 1-.3 3.3 1.2a11.5 11.5 0 0 1 6 0C17.3 4.6 18.3 5 18.3 5c.6 1.7.2 2.9.1 3.2.8.8 1.2 1.9 1.2 3.2 0 4.6-2.8 5.6-5.5 5.9.4.4.8 1.1.8 2.2v3.3c0 .3.2.7.8.6A12 12 0 0 0 12 .3"/></svg>',
  google: '<svg viewBox="0 0 24 24"><path fill="#4285F4" d="M23.5 12.3c0-.8-.1-1.6-.2-2.3H12v4.5h6.5a5.6 5.6 0 0 1-2.4 3.7v3h3.9c2.3-2.1 3.5-5.2 3.5-8.9z"/><path fill="#34A853" d="M12 24c3.2 0 5.9-1.1 7.9-2.9l-3.9-3c-1 .7-2.4 1.2-4 1.2-3.1 0-5.7-2.1-6.6-4.9H1.4v3.1A12 12 0 0 0 12 24z"/><path fill="#FBBC05" d="M5.4 14.4a7.2 7.2 0 0 1 0-4.6V6.7H1.4a12 12 0 0 0 0 10.8l4-3.1z"/><path fill="#EA4335" d="M12 4.8c1.8 0 3.3.6 4.6 1.8l3.4-3.4C17.9 1.2 15.2 0 12 0A12 12 0 0 0 1.4 6.7l4 3.1C6.3 6.9 8.9 4.8 12 4.8z"/></svg>',
};

function renderDemo() {
  if (!config.demo_enabled) return;
  $('#demo-box').classList.remove('hidden');
  $('#demo-creds').textContent = `${config.demo_email} / ${config.demo_password}`;
  $('#demo-btn').addEventListener('click', async () => {
    const btn = $('#demo-btn');
    btn.disabled = true;
    btn.innerHTML = '<span class="spinner"></span> Opening the demo…';
    // Fill the form as well, so it is obvious what the button did and the
    // visitor can sign back in later by hand.
    $('#email').value = config.demo_email;
    $('#password').value = config.demo_password;
    try {
      await api.post('/api/auth/demo', {});
      window.location.href = '/app';
    } catch (e) {
      showError(e.message);
      btn.disabled = false;
      btn.textContent = 'Explore the live demo';
    }
  });
}

function renderOAuth() {
  const buttons = [];
  if (config.google_enabled) {
    buttons.push(`<a class="btn btn-oauth" href="/auth/google/start">${ICONS.google} Continue with Google</a>`);
  }
  if (config.github_enabled) {
    buttons.push(`<a class="btn btn-oauth" href="/auth/github/start">${ICONS.github} Continue with GitHub</a>`);
  }
  $('#oauth').innerHTML = buttons.join('');
  // With no providers configured there is nothing to divide.
  $('#divider').style.display = buttons.length ? '' : 'none';
  $('#oauth').style.display = buttons.length ? '' : 'none';
}

function setMode(next) {
  mode = next;
  const registering = mode === 'register';
  $('#title').textContent = registering ? 'Create your account' : 'Welcome back';
  $('#subtitle').textContent = registering
    ? 'Start tracking your pool — water chemistry and what it costs.'
    : 'Sign in to your pool dashboard.';
  $('#submit').textContent = registering ? 'Create account' : 'Sign in';
  $('#name-field').style.display = registering ? '' : 'none';
  $('#pw-hint').style.display = registering ? '' : 'none';
  $('#password').setAttribute('autocomplete', registering ? 'new-password' : 'current-password');
  $('#invite-field').style.display = registering && config.registration === 'invite' ? '' : 'none';
  $('#error').classList.add('hidden');

  if (config.registration === 'closed') {
    $('#switcher').innerHTML = '<span class="dim">Registration is closed on this instance.</span>';
  } else {
    $('#switcher').innerHTML = registering
      ? 'Already have an account? <a href="#" id="to-login">Sign in</a>'
      : "Don't have an account? <a href=\"#\" id=\"to-register\">Create one</a>";
    const toLogin = document.querySelector('#to-login');
    const toRegister = document.querySelector('#to-register');
    if (toLogin) toLogin.addEventListener('click', e => { e.preventDefault(); setMode('login'); });
    if (toRegister) toRegister.addEventListener('click', e => { e.preventDefault(); setMode('register'); });
  }
}

$('#form').addEventListener('submit', async e => {
  e.preventDefault();
  const btn = $('#submit');
  btn.disabled = true;
  const original = btn.textContent;
  btn.innerHTML = '<span class="spinner"></span>';
  try {
    const body = { email: $('#email').value.trim(), password: $('#password').value };
    if (mode === 'register') {
      body.name = $('#name').value.trim();
      const invite = $('#invite').value.trim();
      if (invite) body.invite = invite;
      await api.post('/api/auth/register', body);
    } else {
      await api.post('/api/auth/login', body);
    }
    window.location.href = '/app';
  } catch (err) {
    showError(err.message);
    btn.disabled = false;
    btn.textContent = original;
  }
});

(async () => {
  try { config = await api.config(); } catch { config = {}; }
  renderOAuth();
  renderDemo();
  const params = new URLSearchParams(window.location.search);
  if (params.get('error')) showError(decodeURIComponent(params.get('error')));
  setMode(params.get('mode') === 'register' && config.registration !== 'closed' ? 'register' : 'login');
})();
</script>
</body>
</html>
