# CI/CD for pool.biswas.me
#
# Public repository, so everything runs on GitHub-hosted runners. Self-hosted
# runners are deliberately NOT used here: on a public repo a pull request from
# any fork can execute workflow code, which on a self-hosted runner means
# arbitrary code execution on the host it runs on.
#
# Flow:
#   pull request  → test + build image (no push, no secrets)
#   push to main  → test → build and push image to GHCR → deploy over SSH
#
# Required repository secrets (Settings → Secrets → Actions):
#   DEPLOY_HOST         host or IP of the production server
#   DEPLOY_USER         SSH user on that server
#   DEPLOY_SSH_KEY      private key (PEM) authorised for that user
#   POOL_ADMIN_EMAIL    seeds the first account on an empty database
#   POOL_ADMIN_PASSWORD
#   POOL_AI_API_KEY     LLM key used when a user has not set their own, and the
#                       fallback when the chain below is not configured
#   DEEPSEEK_API_KEY    primary AI provider, text and vision
#   NVIDIA_API_KEY      backup AI provider
#                       Both are the same secrets 75hard uses. Values cannot be
#                       copied between repositories — GitHub returns them to
#                       nobody, including this workflow's author — so set them
#                       here too, or promote them to organisation secrets shared
#                       by both repositories.
#   OAUTH_STATE_SECRET  stable random string; OAuth breaks on restart without it
#   GOOGLE_CLIENT_ID / GOOGLE_CLIENT_SECRET
#   GH_CLIENT_ID / GH_CLIENT_SECRET
#
# GHCR needs no secret — GITHUB_TOKEN can push to the repo's own package.

name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Lets a deploy be re-run after changing a secret, without a dummy commit.
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.5'
          cache: true

      - name: Verify formatting
        run: |
          unformatted=$(gofmt -l . | grep -v '^vendor/' || true)
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"; echo "$unformatted"; exit 1
          fi

      - run: go vet ./...

      - name: Test
        run: go test -race -coverprofile=coverage.out ./...

      - run: go tool cover -func=coverage.out | tail -1

  build:
    name: Build image
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      # A pull request builds to verify the Dockerfile, but never pushes and
      # never touches the registry.
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=long

      - uses: docker/build-push-action@v7
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ github.ref_name }}
            COMMIT=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: build
    if: |
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
      && github.ref == 'refs/heads/main'
    environment: production
    steps:
      - uses: actions/checkout@v7

      - name: Deploy over SSH
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          POOL_ADMIN_EMAIL: ${{ secrets.POOL_ADMIN_EMAIL }}
          POOL_ADMIN_PASSWORD: ${{ secrets.POOL_ADMIN_PASSWORD }}
          POOL_AI_API_KEY: ${{ secrets.POOL_AI_API_KEY }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          OAUTH_STATE_SECRET: ${{ secrets.OAUTH_STATE_SECRET }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GH_CLIENT_ID: ${{ secrets.GH_CLIENT_ID }}
          GH_CLIENT_SECRET: ${{ secrets.GH_CLIENT_SECRET }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
        run: |
          set -euo pipefail

          mkdir -p ~/.ssh
          echo "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          # ssh-keyscan is the first thing here that touches the network, and
          # it used to run as `... 2>/dev/null` under `set -e`: a host that
          # was briefly unreachable aborted the step with no output at all.
          # A deploy that never started looked exactly like a deploy that
          # broke, which is the worst way for CI to fail.
          #
          # So: retry it, require that it actually returned a key rather than
          # trusting the exit status, and print what went wrong when it gives
          # up. The host name is a secret and is masked in the log, so echoing
          # it is safe.
          for attempt in 1 2 3; do
            if ssh-keyscan -T 10 -H "$DEPLOY_HOST" > /tmp/known_hosts.new 2>/tmp/keyscan.err \
              && [ -s /tmp/known_hosts.new ]; then
              cat /tmp/known_hosts.new >> ~/.ssh/known_hosts
              break
            fi
            if [ "$attempt" = 3 ]; then
              echo "::error::could not reach $DEPLOY_HOST after 3 attempts — the deploy has not started, and nothing on the server has changed"
              cat /tmp/keyscan.err >&2
              exit 1
            fi
            echo "ssh-keyscan attempt $attempt failed, retrying in 5s" >&2
            sleep 5
          done

          # The env file is written on the server, not committed anywhere.
          cat > /tmp/pool.env <<EOF
          POOL_ENV=production
          POOL_APP_URL=https://pool.biswas.me
          POOL_REGISTRATION=open
          POOL_ADMIN_EMAIL=${POOL_ADMIN_EMAIL}
          POOL_ADMIN_PASSWORD=${POOL_ADMIN_PASSWORD}
          # The provider chain, in 75hard's shape but with DeepSeek in front.
          #
          # DeepSeek reads a photographed test sheet in about 30 seconds where
          # NVIDIA's 90b takes 158, and Cloudflare cuts a proxied request at
          # 100 — so on the slow one the upload failed in the browser before
          # the answer ever arrived. NVIDIA stays as the backup, which is what
          # a chain is for.
          #
          # AI_*  is the text chain (the water analysis).
          # AIV_* is the vision chain (reading a photographed sheet), separate
          #       because a provider's cheapest text model and its vision model
          #       are rarely the same one.
          AI_1_PROVIDER=deepseek
          AI_1_MODEL=deepseek-v4-flash
          AI_1_API_KEY=${DEEPSEEK_API_KEY}
          AI_2_PROVIDER=nvidia
          AI_2_MODEL=meta/llama-3.2-90b-vision-instruct
          AI_2_API_KEY=${NVIDIA_API_KEY}
          AIV_1_PROVIDER=deepseek
          AIV_1_MODEL=deepseek-v4-flash-vision-exp
          AIV_1_API_KEY=${DEEPSEEK_API_KEY}
          AIV_2_PROVIDER=nvidia
          AIV_2_MODEL=meta/llama-3.2-90b-vision-instruct
          AIV_2_API_KEY=${NVIDIA_API_KEY}
          POOL_AI_API_KEY=${POOL_AI_API_KEY}
          POOL_AI_BASE_URL=https://integrate.api.nvidia.com/v1
          POOL_AI_MODEL=meta/llama-3.2-90b-vision-instruct
          OAUTH_STATE_SECRET=${OAUTH_STATE_SECRET}
          GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
          GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
          GH_CLIENT_ID=${GH_CLIENT_ID}
          GH_CLIENT_SECRET=${GH_CLIENT_SECRET}
          EOF

          scp -i ~/.ssh/deploy_key /tmp/pool.env "$DEPLOY_USER@$DEPLOY_HOST:/opt/pool/.env"

          # The image name is resolved here and passed in; the heredoc is
          # quoted so nothing else expands on the runner.
          ssh -i ~/.ssh/deploy_key "$DEPLOY_USER@$DEPLOY_HOST" \
            "IMAGE='${IMAGE}:latest' GHCR_USER='${GHCR_USER}' GHCR_TOKEN='${GHCR_TOKEN}' bash -s" <<'REMOTE'
          set -euo pipefail
          cd /opt/pool

          # The package is private, so authenticate the pull with the token
          # this workflow run already has. It expires when the run ends.
          echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
          docker pull "$IMAGE"
          docker logout ghcr.io

          docker rm -f pool 2>/dev/null || true
          docker run -d \
            --name pool \
            --restart unless-stopped \
            -p 127.0.0.1:8477:8080 \
            -v /opt/pool/data:/data \
            --env-file /opt/pool/.env \
            "$IMAGE"

          # Wait for the new container to report healthy before calling it done.
          for i in $(seq 1 30); do
            if [ "$(docker inspect -f '{{.State.Health.Status}}' pool 2>/dev/null)" = "healthy" ]; then
              echo "pool is healthy"
              docker image prune -f
              exit 0
            fi
            sleep 2
          done

          echo "container did not become healthy:"
          docker logs --tail 50 pool
          exit 1
          REMOTE
